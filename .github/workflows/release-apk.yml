name: Release Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create \
            --project-name lingo \
            --org com.dmw2121 \
            --platforms android \
            "$RUNNER_TEMP/lingo-bootstrap"
          cp -R "$RUNNER_TEMP/lingo-bootstrap/android" ./android

      - name: Set Android minimum SDK
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          build_file = next((path for path in gradle_files if path.exists()), None)
          if build_file is None:
              raise SystemExit("Generated Android app Gradle file was not found.")

          content = build_file.read_text()
          pattern = re.compile(
              r"(?m)^(\s*minSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.minSdkVersion|\d+)"
          )
          content, replacements = pattern.subn(r"\g<1>24", content, count=1)
          if replacements != 1:
              raise SystemExit("Could not set the Android minimum SDK to 24.")
          build_file.write_text(content)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Archive APK
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: lingo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
